<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Statu Hunt - Final Sync</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* LOBBY */
        #lobby { background: #2c3e50; padding: 30px; border-radius: 15px; text-align: center; width: 550px; box-shadow: 0 0 30px rgba(0,0,0,0.5); z-index: 100; }
        .input-group { margin: 20px 0; }
        input { padding: 12px; border-radius: 8px; border: none; width: 80%; text-align: center; font-size: 1rem; background: #1a1a1a; color: white; }
        button { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; margin: 5px; }
        .btn-blue { background: #3498db; color: white; }
        .btn-red { background: #e74c3c; color: white; }
        .btn-green { background: #27ae60; color: white; width: 100%; margin-top: 15px; }
        button:disabled { background: #7f8c8d; cursor: not-allowed; opacity: 0.5; }
        
        .code-display { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .teams { display: flex; gap: 15px; margin-top: 20px; }
        .team-box { flex: 1; background: #34495e; padding: 10px; border-radius: 10px; min-height: 150px; }
        .player-tag { background: rgba(0,0,0,0.2); padding: 8px; margin: 5px 0; border-radius: 6px; font-size: 0.9rem; border-left: 4px solid #f1c40f; text-align: left; }
        
        /* JEU */
        canvas { position: absolute; top: 0; left: 0; display: none; background: #000; }
        #ui-game { position: absolute; top: 20px; left: 20px; z-index: 50; display: none; pointer-events: none; }
        .fear-bar-container { width: 250px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); }
        .fear-bar { width: 100%; height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin-top: 5px; }
        #fear-fill { width: 0%; height: 100%; background: #e74c3c; transition: width 0.3s; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1>STATU HUNT</h1>
        <div id="step-pseudo">
            <input type="text" id="pseudoInput" placeholder="Ton pseudo..." onkeydown="if(event.key==='Enter') confirmPseudo()">
            <br><button class="btn-blue" onclick="confirmPseudo()">CONTINUER</button>
        </div>
        <div id="step-menu" class="hidden">
            <button class="btn-blue" onclick="createRoom()">CRÉER UNE SALLE</button>
            <p>— OU —</p>
            <input type="text" id="joinInput" placeholder="CODE DE PARTIE">
            <br><button class="btn-blue" onclick="joinRoom()">REJOINDRE</button>
        </div>
        <div id="step-room" class="hidden">
            <div class="code-display">
                CODE : <span id="displayCode" style="color:#f1c40f; font-weight:bold; font-size:1.5rem;">---</span>
                <button id="copyBtn" style="background:#95a5a6; padding:5px 10px; font-size:0.8rem;" onclick="copyCode()">COPIER 📋</button>
            </div>
            <div class="teams">
                <div class="team-box"><h4 style="color:#3498db">CHERCHEURS</h4><button onclick="selectTeam('seeker')" class="btn-blue" style="font-size:0.7rem">REJOINDRE</button><div id="list-seekers"></div></div>
                <div class="team-box"><h4 style="color:#e74c3c">CACHÉS</h4><button onclick="selectTeam('hider')" class="btn-red" style="font-size:0.7rem">REJOINDRE</button><div id="list-hiders"></div></div>
            </div>
            <button id="startBtn" class="hidden btn-green" onclick="requestStart()" disabled>ATTENTE DES ÉQUIPES...</button>
        </div>
    </div>

    <div id="ui-game">
        <div id="game-status" style="color:#f1c40f; font-weight:bold; font-size:1.5rem; text-shadow: 2px 2px 4px #000;">L
