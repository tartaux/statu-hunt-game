<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Statu Hunt - Hardcore Vision</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #lobby, #end-screen { background: #2c3e50; padding: 30px; border-radius: 15px; text-align: center; width: 550px; box-shadow: 0 0 50px rgba(0,0,0,0.8); z-index: 100; border: 1px solid #34495e; position: absolute; }
        #end-screen { display: none; background: rgba(20, 30, 48, 0.98); z-index: 200; border: 2px solid #f1c40f; }
        
        input { padding: 12px; border-radius: 8px; border: none; width: 80%; text-align: center; font-size: 1rem; background: #1a1a1a; color: white; margin-bottom: 10px; border: 1px solid #34495e; }
        button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; margin: 5px; position: relative; z-index: 150; text-transform: uppercase; letter-spacing: 1px; }
        .btn-blue { background: #3498db; color: white; box-shadow: 0 4px #2980b9; }
        .btn-blue:active { transform: translateY(2px); box-shadow: 0 2px #2980b9; }
        .btn-red { background: #e74c3c; color: white; box-shadow: 0 4px #c0392b; }
        .btn-green { background: #27ae60; color: white; width: 100%; margin-top: 15px; font-size: 1.1rem; box-shadow: 0 4px #1e8449; }
        button:disabled { background: #7f8c8d; cursor: not-allowed; opacity: 0.5; box-shadow: none; }
        
        .config-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid rgba(255,255,255,0.1); }
        .teams, .end-teams { display: flex; gap: 15px; margin-top: 20px; }
        .team-box { flex: 1; background: #1a252f; padding: 10px; border-radius: 10px; min-height: 150px; border: 1px solid #34495e; }
        .player-tag { background: rgba(52, 152, 219, 0.1); padding: 8px; margin: 5px 0; border-radius: 6px; font-size: 0.9rem; border-left: 4px solid #f1c40f; text-align: left; }
        
        canvas { position: absolute; top: 0; left: 0; display: none; background: #000; }
        #ui-game { position: absolute; top: 20px; left: 20px; z-index: 50; display: none; pointer-events: none; width: calc(100% - 40px); }
        #game-status { color: #f1c40f; font-weight: bold; font-size: 1.8rem; text-shadow: 3px 3px 5px #000; letter-spacing: 2px; }
        
        .fear-bar-container { width: 300px; background: rgba(0,0,0,0.7); padding: 12px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.1); margin-top: 10px; backdrop-filter: blur(5px); }
        .fear-bar { width: 100%; height: 15px; background: #222; border-radius: 10px; overflow: hidden; margin-top: 8px; border: 1px solid #444; }
        #fear-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #e74c3c, #ff4d4d); transition: width 0.1s; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1 style="letter-spacing: 5px; color: #f1c40f;">STATU HUNT</h1>
        <div id="step-pseudo">
            <input type="text" id="pseudoInput" placeholder="ENTREZ VOTRE NOM..." maxlength="15" onkeydown="if(event.key==='Enter') confirmPseudo()">
            <br><button class="btn-blue" onclick="confirmPseudo()">REJOINDRE L'OMBRE</button>
        </div>
        <div id="step-menu" class="hidden">
            <button class="btn-blue" onclick="createRoom()">CRÉER UNE SALLE</button>
            <p style="color: #bdc3c7;">— OU —</p>
            <input type="text" id="joinInput" placeholder="CODE SECRET">
            <br><button class="btn-blue" onclick="joinRoom()">REJOINDRE</button>
        </div>
        <div id="step-room" class="hidden">
            <div style="background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; border: 1px solid #f1c40f;">
                CODE : <span id="displayCode" style="color:#f1c40f; font-weight:bold; font-size: 1.2rem;">---</span>
                <button id="copyBtn" style="background:#7f8c8d; font-size:0.7rem; margin-left: 10px;" onclick="copyCode()">COPIER 📋</button>
            </div>
            <div class="config-box">
                <span style="font-size: 0.8rem; color: #bdc3c7;">TEMPS DE SURVIE</span><br>
                <button id="btnLess" class="btn-blue" onclick="changeTimer(-30)">-</button>
                <span id="timerSetting" style="font-weight:bold; font-size:1.5rem; margin: 0 15px;">2:00</span>
                <button id="btnMore" class="btn-blue" onclick="changeTimer(30)">+</button>
            </div>
            <div class="teams">
                <div class="team-box">
                    <h4 style="color: #3498db;">CHERCHEURS</h4>
                    <button onclick="selectTeam('seeker')" class="btn-blue" style="font-size:0.7rem">REJOINDRE</button>
                    <div id="list-seekers"></div>
                </div>
                <div class="team-box">
                    <h4 style="color: #e74c3c;">CACHÉS</h4>
                    <button onclick="selectTeam('hider')" class="btn-red" style="font-size:0.7rem">REJOINDRE</button>
                    <div id="list-hiders"></div>
                </div>
            </div>
            <button id="startBtn" class="hidden btn-green" onclick="requestStart()" disabled>EN ATTENTE DES ÉQUIPES...</button>
        </div>
    </div>

    <div id="end-screen">
        <h2 id="victory-title">VICTOIRE !</h2>
        <p id="victory-desc" style="font-style: italic; color: #bdc3c7;"></p>
        <div class="end-teams">
            <div class="team-box"><h4>CHERCHEURS</h4><div id="end-seekers"></div></div>
            <div class="team-box"><h4>CACHÉS</h4><div id="end-hiders"></div></div>
        </div>
        <button id="backToLobbyBtn" class="btn-green" onclick="requestBackToLobby()" style="display:none;">RETOURNER AU LOBBY</button>
        <p id="waitHostText" style="font-size: 0.8rem; color: #bdc3c7; margin-top: 15px;">L'hôte prépare la suite...</p>
    </div>

    <div id="ui-game">
        <div id="game-status"></div>
        <div id="fear-ui" class="fear-bar-container hidden">
            <span style="font-size:0.7rem; font-weight:bold; color: #e74c3c; text-transform: uppercase;">Stabilité Mentale</span>
            <div class="fear-bar"><div id="fear-fill"></div></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    let myPseudo, myId, isHost = false, players = {}, peer, conn, gameActive = false, roomCode = "";
    let gameState = "PREP", prepTimer = 10, gameDuration = 120, initialDuration = 120;
    let lastUpdate = Date.now(), logicInterval, masterTimer;
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mapW = 2000, mapH = 2000, keys = {}, statues = [];
    let mousePos = { x: 0, y: 0 };

    function confirmPseudo() {
        myPseudo = document.getElementById('pseudoInput').value.trim();
        if(myPseudo.length < 2) return alert("Nom trop court !");
        document.getElementById('step-pseudo').classList.add('hidden');
        document.getElementById('step-menu').classList.remove('hidden');
    }

    function createRoom() {
        roomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
        isHost = true; setupPeer('SH-' + roomCode); showRoom(roomCode);
        document.getElementById('startBtn').classList.remove('hidden');
        document.getElementById('backToLobbyBtn').style.display = 'block';
        document.getElementById('waitHostText').style.display = 'none';
    }

    function joinRoom() {
        roomCode = document.getElementById('joinInput').value.toUpperCase().trim();
        if(!roomCode) return alert("Entrez un code !");
        setupPeer();
        setTimeout(() => { conn = peer.connect('SH-' + roomCode); initConn(conn); }, 800);
        showRoom(roomCode);
        document.getElementById('btnLess').style.display = 'none';
        document.getElementById('btnMore').style.display = 'none';
    }

    function setupPeer(id = null) {
        peer = new Peer(id);
        peer.on('open', (i) => {
            myId = i;
            players[myId] = {pseudo: myPseudo, team: null, x: 1000, y: 1000, angle: 0, fear: 0};
            refreshUI();
        });
        peer.on('connection', (c) => {
            conn = c; initConn(c);
            if(isHost) setTimeout(() => {
                c.send({type:'SYNC', players: players});
                c.send({type:'SYNC_TIMER', duration: gameDuration});
            }, 1000);
        });
    }

    function initConn(c) {
        c.on('open', () => c.send({type: 'JOIN', pseudo: myPseudo}));
        c.on('data', (data) => {
            if(data.type === 'JOIN') {
                players[c.peer] = {pseudo: data.pseudo, team: null, x: 1000, y: 1000, angle: 0, fear: 0};
                if(isHost) broadcast({type:'SYNC', players: players});
            }
            if(data.type === 'SYNC') { players = data.players; refreshUI(); }
            if(data.type === 'SYNC_TIMER') { gameDuration = data.duration; initialDuration = data.duration; updateTimerDisplay(); }
            if(data.type === 'START') startClientGame();
            if(data.type === 'END') showEndScreen(data.winner, data.reason);
            if(data.type === 'BACK_LOBBY') resetToLobby();
            if(data.type === 'POS') { if(players[data.id]) players[data.id] = {...players[data.id], ...data}; }
        });
    }

    function broadcast(data) { if(conn && conn.open) conn.send(data); }

    function selectTeam(t) {
        if(!myId || !players[myId]) return;
        players[myId].team = t;
        refreshUI();
        if(conn) {
            if(isHost) broadcast({type: 'SYNC', players: players});
            else conn.send({type: 'SYNC', players: players});
        }
    }

    function refreshUI() {
        const sDiv = document.getElementById('list-seekers'), hDiv = document.getElementById('list-hiders');
        if(!sDiv || !hDiv) return;
        sDiv.innerHTML = ''; hDiv.innerHTML = '';
        let sCount = 0, hCount = 0;
        for(let id in players) {
            let p = players[id];
            let tag = `<div class="player-tag">${p.pseudo}${id === myId ? " (Moi)" : ""}</div>`;
            if(p.team === 'seeker') { sCount++; sDiv.innerHTML += tag; }
            if(p.team === 'hider') { hCount++; hDiv.innerHTML += tag; }
        }
        if(isHost) {
            const btn = document.getElementById('startBtn');
            btn.disabled = !(sCount > 0 && hCount > 0);
            btn.innerText = (sCount > 0 && hCount > 0) ? "LANCER LA CHASSE" : "ÉQUIPES INCOMPLÈTES...";
        }
    }

    function changeTimer(val) {
        if(!isHost) return;
        gameDuration = Math.max(60, Math.min(600, gameDuration + val));
        initialDuration = gameDuration;
        updateTimerDisplay();
        broadcast({type: 'SYNC_TIMER', duration: gameDuration});
    }

    function updateTimerDisplay() {
        let m = Math.floor(gameDuration/60), s = gameDuration%60;
        document.getElementById('timerSetting').innerText = `${m}:${s === 0 ? '00' : s}`;
    }

    function copyCode() {
        navigator.clipboard.writeText(roomCode).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "COPIÉ ! ✅";
            setTimeout(() => btn.innerText = "COPIER 📋", 2000);
        });
    }

    function showRoom(code) {
        document.getElementById('step-menu').classList.add('hidden');
        document.getElementById('step-room').classList.remove('hidden');
        document.getElementById('displayCode').innerText = code;
    }

    function startClientGame() {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('ui-game').style.display = 'block';
        canvas.style.display = 'block';
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        statues.length = 0;
        generateMap(roomCode);
        gameActive = true; gameState = "PREP"; prepTimer = 10;
        lastUpdate = Date.now();
        logicInterval = setInterval(update, 1000/60);
        masterTimer = setInterval(() => {
            if(gameState === "PREP") {
                prepTimer--;
                document.getElementById('game-status').innerText = "LES STATUES SE PLACENT : " + prepTimer + "s";
                if(prepTimer <= 0) gameState = "HUNT";
            } else {
                gameDuration--;
                let m = Math.floor(gameDuration/60), s = gameDuration%60;
                document.getElementById('game-status').innerText = `TEMPS RESTANT : ${m}:${s<10?'0'+s:s}`;
                if(gameDuration <= 0 && isHost) {
                    broadcast({type: 'END', winner: 'hiders', reason: "Le temps est écoulé ! Les statues sont victorieuses."});
                    showEndScreen('hiders', "Le temps est écoulé ! Les statues sont victorieuses.");
                }
            }
        }, 1000);
        requestAnimationFrame(draw);
    }

    function update() {
        const me = players[myId];
        if(!me || !gameActive) return;
        const now = Date.now();
        const dt = (now - lastUpdate) / 16.66;
        lastUpdate = now;

        let moved = false;
        // BLOQUER LE CHASSEUR EN PREPARATION
        let canMove = true;
        if(me.team === 'seeker' && gameState === "PREP") canMove = false;

        if(canMove) {
            let spd = (me.team === 'seeker' ? 6 : 4.5) * dt;
            if(keys['z'] || keys['w']) { me.y -= spd; moved = true; }
            if(keys['s']) { me.y += spd; moved = true; }
            if(keys['q'] || keys['a']) { me.x -= spd; moved = true; }
            if(keys['d']) { me.x += spd; moved = true; }
        }

        me.x = Math.max(0, Math.min(mapW - 25, me.x));
        me.y = Math.max(0, Math.min(mapH - 25, me.y));

        if(me.team === 'seeker') {
            me.angle = Math.atan2(mousePos.y - canvas.height/2, mousePos.x - canvas.width/2);
            if(gameState === "HUNT" && isHost) {
                for(let id in players) {
                    let p = players[id];
                    if(p.team === 'hider' && Math.sqrt((me.x - p.x)**2 + (me.y - p.y)**2) < 35) {
                        broadcast({type: 'END', winner: 'seekers', reason: `${p.pseudo} a été brisé !`});
                        showEndScreen('seekers', `${p.pseudo} a été brisé !`);
                    }
                }
            }
        } else if(gameState === "HUNT") {
            if(!moved) me.fear = Math.min(100, me.fear + (0.4 * dt));
            else me.fear = Math.max(0, me.fear - (1.2 * dt));
        }
        if(conn && conn.open) conn.send({type: 'POS', id: myId, x: me.x, y: me.y, angle: me.angle, fear: me.fear});
    }

    function draw() {
        if(!gameActive) return;
        const me = players[myId];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const camX = -me.x + canvas.width/2, camY = -me.y + canvas.height/2;

        ctx.save();
        ctx.translate(camX, camY);

        // SOL
        ctx.fillStyle = "#111"; ctx.fillRect(0,0, mapW, mapH);
        ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 2;
        for(let x=0; x<mapW; x+=80) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,mapH); ctx.stroke(); }
        for(let y=0; y<mapH; y+=80) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(mapW,y); ctx.stroke(); }

        // STATUES DE DÉCOR
        statues.forEach(s => drawStatue(s.x, s.y, "#555", false, false));

        // JOUEURS
        for(let id in players) {
            const p = players[id];
            if(p.team === 'hider') {
                // LOGIQUE VISUELLE CRUCIALE : 
                // Pour le chercheur, la statue est grise et stable jusqu'à 100% de peur.
                // Pour le joueur lui-même, elle devient rouge progressivement.
                let isMe = (id === myId);
                let fearLevel = p.fear;
                let color = "#555";
                let pulse = (fearLevel >= 100);
                let shake = (fearLevel > 80);

                if(isMe) {
                    if(fearLevel > 80) color = "#962d22";
                } else if(me.team === 'seeker') {
                    // Le chercheur ne voit pas la couleur rouge, seulement l'effet de panique à 100%
                    color = "#555";
                } else {
                    // Les autres cachés voient la panique des collègues
                    if(fearLevel > 80) color = "#962d22";
                }

                let ox = (shake) ? (Math.random()*2-1) : 0;
                drawStatue(p.x + ox, p.y, color, pulse, isMe);
            } else if(p.team === 'seeker') {
                drawSeeker(p);
            }
        }
        ctx.restore();

        drawLighting(me);

        if(me.team === 'hider') {
            document.getElementById('fear-ui').classList.remove('hidden');
            document.getElementById('fear-fill').style.width = me.fear + "%";
            if(me.fear >= 100) document.getElementById('fear-fill').style.background = "#ff0000";
            else document.getElementById('fear-fill').style.background = "linear-gradient(90deg, #e74c3c, #ff4d4d)";
        }
        requestAnimationFrame(draw);
    }

    function drawStatue(x, y, color, pulse, isPlayerSelf) {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.beginPath(); ctx.ellipse(x+12, y+28, 18, 8, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#222"; ctx.fillRect(x-4, y+20, 33, 8);
        ctx.fillStyle = color; ctx.fillRect(x, y, 25, 22);
        
        // Indicateur discret pour soi-même
        if(isPlayerSelf) {
            ctx.fillStyle = "#f1c40f"; ctx.fillRect(x+10, y-5, 5, 5);
        }

        if(pulse) {
            ctx.beginPath(); ctx.arc(x+12.5, y+11, (Date.now()%800)/10 + 10, 0, Math.PI*2);
            ctx.strokeStyle = "rgba(231, 76, 60, 0.6)"; ctx.lineWidth = 3; ctx.stroke();
        }
    }

    function drawSeeker(p) {
        let g = ctx.createRadialGradient(p.x+12, p.y+12, 5, p.x+12, p.y+12, 35);
        g.addColorStop(0, "rgba(52, 152, 219, 0.4)"); g.addColorStop(1, "transparent");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x+12, p.y+12, 35, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#3498db"; ctx.fillRect(p.x, p.y, 25, 25);
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, 25, 25);
    }

    function drawLighting(me) {
        ctx.save();
        if(me.team === 'seeker') {
            let cx = canvas.width/2 + 12, cy = canvas.height/2 + 12;
            ctx.fillStyle = "rgba(0,0,0,0.98)";
            ctx.beginPath(); ctx.rect(0,0, canvas.width, canvas.height);
            if(gameState === "HUNT") {
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, 500, me.angle-0.55, me.angle+0.55);
            } else {
                ctx.arc(cx, cy, 120, 0, Math.PI*2);
            }
            ctx.fill("evenodd");
        } else {
            let grd = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, canvas.width/1.1);
            grd.addColorStop(0, "transparent"); grd.addColorStop(1, "rgba(0,0,0,0.85)");
            ctx.fillStyle = grd; ctx.fillRect(0,0, canvas.width, canvas.height);
        }
        ctx.restore();
    }

    function generateMap(seedString) {
        let seed = 0;
        for (let i = 0; i < seedString.length; i++) seed += seedString.charCodeAt(i);
        const pseudoRandom = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
        for(let i=0; i<150; i++) {
            let x, y, tooClose, attempts = 0;
            do {
                tooClose = false;
                x = 100 + pseudoRandom() * (mapW - 200);
                y = 100 + pseudoRandom() * (mapH - 200);
                for(let s of statues) { if(Math.sqrt((x-s.x)**2 + (y-s.y)**2) < 60) tooClose = true; }
                attempts++;
            } while(tooClose && attempts < 50);
            statues.push({x, y});
        }
    }

    function showEndScreen(winner, reason) {
        gameActive = false; clearInterval(logicInterval); clearInterval(masterTimer);
        document.getElementById('ui-game').style.display = 'none';
        document.getElementById('end-screen').style.display = 'block';
        const title = document.getElementById('victory-title');
        title.innerText = (winner === 'seekers') ? "L'INTRUS A GAGNÉ !" : "LES STATUES SONT SAUVES !";
        title.className = (players[myId].team && players[myId].team.startsWith(winner.substring(0,1))) ? "win-text" : "lose-text";
        document.getElementById('victory-desc').innerText = reason;
        const sList = document.getElementById('end-seekers'), hList = document.getElementById('end-hiders');
        sList.innerHTML = ''; hList.innerHTML = '';
        for(let id in players) {
            let tag = `<div class="player-tag">${players[id].pseudo}</div>`;
            if(players[id].team === 'seeker') sList.innerHTML += tag;
            else if(players[id].team === 'hider') hList.innerHTML += tag;
        }
    }

    function requestBackToLobby() { if(!isHost) return; broadcast({type: 'BACK_LOBBY'}); resetToLobby(); }
    function resetToLobby() {
        gameActive = false; canvas.style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('lobby').style.display = 'block';
        gameDuration = initialDuration;
        if(players[myId]) { players[myId].fear = 0; players[myId].x = 1000; players[myId].y = 1000; }
        updateTimerDisplay(); refreshUI();
    }
    function requestStart() { if(isHost) { broadcast({type: 'START'}); startClientGame(); } }

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => { mousePos.x = e.clientX; mousePos.y = e.clientY; });
</script>
</body>
</html>
