<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Statu Hunt - Fear Spam Mode</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #lobby, #end-screen { background: #2c3e50; padding: 30px; border-radius: 15px; text-align: center; width: 550px; box-shadow: 0 0 50px rgba(0,0,0,0.8); z-index: 100; border: 1px solid #34495e; position: absolute; }
        #end-screen { display: none; background: rgba(20, 30, 48, 0.98); z-index: 200; border: 2px solid #f1c40f; }
        input { padding: 12px; border-radius: 8px; border: none; width: 80%; text-align: center; font-size: 1rem; background: #1a1a1a; color: white; margin-bottom: 10px; border: 1px solid #34495e; }
        button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; margin: 5px; position: relative; z-index: 150; text-transform: uppercase; letter-spacing: 1px; }
        .btn-blue { background: #3498db; color: white; box-shadow: 0 4px #2980b9; }
        .btn-red { background: #e74c3c; color: white; box-shadow: 0 4px #c0392b; }
        .btn-green { background: #27ae60; color: white; width: 100%; margin-top: 15px; font-size: 1.1rem; box-shadow: 0 4px #1e8449; }
        button:disabled { background: #7f8c8d !important; box-shadow: 0 4px #95a5a6 !important; cursor: not-allowed; opacity: 0.6; }
        .config-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin: 10px 0; }
        .teams { display: flex; gap: 15px; margin-top: 20px; }
        .team-box { flex: 1; background: #1a252f; padding: 10px; border-radius: 10px; min-height: 150px; border: 1px solid #34495e; }
        .player-tag { background: rgba(52, 152, 219, 0.1); padding: 8px; margin: 5px 0; border-radius: 6px; font-size: 0.9rem; border-left: 4px solid #f1c40f; text-align: left; }
        canvas { position: absolute; top: 0; left: 0; display: none; background: #000; }
        #ui-game { position: absolute; top: 20px; left: 20px; z-index: 50; display: none; pointer-events: none; width: calc(100% - 40px); }
        #game-status { color: #f1c40f; font-weight: bold; font-size: 1.8rem; text-shadow: 3px 3px 5px #000; }
        .fear-bar-container { width: 300px; background: rgba(0,0,0,0.7); padding: 12px; border-radius: 10px; margin-top: 10px; }
        .fear-bar { width: 100%; height: 15px; background: #222; border-radius: 10px; overflow: hidden; margin-top: 8px; }
        #fear-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #e74c3c, #ff4d4d); }
        .size-btn { font-size: 0.7rem; padding: 5px 10px; opacity: 0.5; }
        .size-btn.active { opacity: 1; border: 2px solid #f1c40f; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="lobby">
        <h1 style="color: #f1c40f; letter-spacing: 3px;">STATU HUNT</h1>
        <div id="step-pseudo">
            <input type="text" id="pseudoInput" placeholder="NOM DU JOUEUR..." maxlength="15">
            <br><button class="btn-blue" onclick="confirmPseudo()">REJOINDRE</button>
        </div>
        <div id="step-menu" class="hidden">
            <button class="btn-blue" onclick="createRoom()">CRÉER SALLE</button>
            <p>— OU —</p>
            <input type="text" id="joinInput" placeholder="CODE">
            <br><button class="btn-blue" onclick="joinRoom()">REJOINDRE SALLE</button>
        </div>
        <div id="step-room" class="hidden">
            <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px;">
                CODE : <span id="displayCode" style="color:#f1c40f; font-weight: bold; font-size: 1.2rem;">---</span>
                <button id="copyBtn" class="btn-blue" style="font-size: 0.7rem; padding: 5px 10px; margin-left: 10px;" onclick="copyCode()">COPIER</button>
            </div>
            
            <div class="config-box">
                DURÉE : <button class="btn-blue" onclick="changeTimer(-30)">-</button>
                <span id="timerSetting" style="margin: 0 10px; font-weight: bold;">2:00</span>
                <button class="btn-blue" onclick="changeTimer(30)">+</button>
            </div>

            <div class="config-box" id="size-selector">
                TAILLE MAP : 
                <button id="size-S" class="btn-blue size-btn active" onclick="setMapSize('S')">PETITE (1x)</button>
                <button id="size-M" class="btn-blue size-btn" onclick="setMapSize('M')">MOYENNE (2x)</button>
                <button id="size-L" class="btn-blue size-btn" onclick="setMapSize('L')">GRANDE (3x)</button>
            </div>

            <div class="teams">
                <div class="team-box"><h4>CHERCHEURS</h4><button onclick="selectTeam('seeker')" class="btn-blue" style="font-size: 0.7rem;">REJOINDRE</button><div id="list-seekers"></div></div>
                <div class="team-box"><h4>CACHÉS</h4><button onclick="selectTeam('hider')" class="btn-red" style="font-size: 0.7rem;">REJOINDRE</button><div id="list-hiders"></div></div>
            </div>
            <button id="startBtn" class="hidden btn-green" onclick="requestStart()" disabled>EN ATTENTE DES JOUEURS</button>
        </div>
    </div>

    <div id="end-screen">
        <h2 id="victory-title">FIN</h2>
        <p id="victory-desc" style="font-style: italic; color: #bdc3c7;"></p>
        <button id="backToLobbyBtn" class="btn-green" onclick="requestBackToLobby()" style="display:none;">RETOUR LOBBY</button>
    </div>

    <div id="ui-game">
        <div id="game-status"></div>
        <div id="fear-ui" class="fear-bar-container hidden">
            <div class="fear-bar"><div id="fear-fill"></div></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    let myPseudo, myId, isHost = false, players = {}, peer, connections = [], hostConn = null, gameActive = false, roomCode = "";
    let gameState = "PREP", prepTimer = 10, gameDuration = 120;
    let lastUpdate = Date.now(), logicInterval, masterTimer;
    let mapSizeKey = 'S', mapW = 2000, mapH = 2000;
    
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statues = [];
    const keys = {};
    let mousePos = { x: 0, y: 0 };
    const waves = [];
    let lastShockwave = 0;
    let detectionArrows = [];
    let fearSpamCounter = 0; // Pour cadencer le spam de l'onde

    function confirmPseudo() {
        myPseudo = document.getElementById('pseudoInput').value.trim();
        if(myPseudo) { document.getElementById('step-pseudo').classList.add('hidden'); document.getElementById('step-menu').classList.remove('hidden'); }
    }

    function copyCode() {
        navigator.clipboard.writeText(roomCode).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "COPIÉ !";
            setTimeout(() => btn.innerText = "COPIER", 2000);
        });
    }

    function setMapSize(size) {
        if(!isHost) return;
        mapSizeKey = size;
        if(size === 'S') { mapW = 2000; mapH = 2000; }
        if(size === 'M') { mapW = 2830; mapH = 2830; }
        if(size === 'L') { mapW = 3465; mapH = 3465; }
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('size-' + size).classList.add('active');
        broadcast({type: 'SYNC_SIZE', size: size, w: mapW, h: mapH});
    }

    function createRoom() {
        roomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
        isHost = true; setupPeer('SH-' + roomCode); showRoom(roomCode);
        document.getElementById('startBtn').classList.remove('hidden');
        document.getElementById('backToLobbyBtn').style.display = 'block';
    }

    function joinRoom() {
        roomCode = document.getElementById('joinInput').value.toUpperCase().trim();
        setupPeer();
        setTimeout(() => { hostConn = peer.connect('SH-' + roomCode); initConn(hostConn); }, 800);
        showRoom(roomCode);
        document.getElementById('size-selector').style.pointerEvents = 'none';
        document.getElementById('size-selector').style.opacity = '0.7';
    }

    function setupPeer(id = null) {
        peer = new Peer(id);
        peer.on('open', (i) => {
            myId = i;
            players[myId] = {pseudo: myPseudo, team: null, x: 1000, y: 1000, angle: 0, fear: 0, isMoving: false, isCaptured: false};
            refreshUI();
        });
        peer.on('connection', (c) => {
            connections.push(c);
            initConn(c);
            if(isHost) setTimeout(() => { 
                c.send({type:'SYNC', players: players}); 
                c.send({type:'SYNC_TIMER', duration: gameDuration});
                c.send({type:'SYNC_SIZE', size: mapSizeKey, w: mapW, h: mapH});
            }, 500);
        });
    }

    function initConn(c) {
        c.on('data', (data) => {
            if(data.type === 'JOIN') { 
                players[c.peer] = {pseudo: data.pseudo, team: null, x: 1000, y: 1000, angle: 0, fear: 0, isMoving: false, isCaptured: false}; 
                if(isHost) broadcast({type:'SYNC', players: players}); 
            }
            if(data.type === 'SYNC') { 
                players = data.players; 
                if(isHost) broadcast({type:'SYNC', players: players});
                refreshUI(); 
            }
            if(data.type === 'SYNC_TIMER') { gameDuration = data.duration; updateTimerDisplay(); }
            if(data.type === 'SYNC_SIZE') { 
                mapSizeKey = data.size; mapW = data.w; mapH = data.h;
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('size-' + data.size).classList.add('active');
            }
            if(data.type === 'START') { players = data.players; startClientGame(); }
            if(data.type === 'END') showEndScreen(data.winner, data.reason);
            if(data.type === 'BACK_LOBBY') resetToLobby();
            
            if(data.type === 'CAPTURE') {
                if(players[data.targetId]) players[data.targetId].isCaptured = true;
                if(isHost) { broadcast({type: 'SYNC', players: players}); checkWinCondition(); }
            }

            if(data.type === 'POS') { if(players[data.id]) players[data.id] = {...players[data.id], ...data}; }
            if(data.type === 'SHOCKWAVE') { waves.push({x: data.x, y: data.y, r: 0, maxR: data.maxR, owner: data.owner, waveType: data.waveType}); }
            if(data.type === 'FEAR_HIT' && data.targetId === myId && !players[myId].isCaptured) { players[myId].fear = Math.min(100, players[myId].fear + data.amount); }
        });
        if(!isHost && c === hostConn) {
            c.on('open', () => c.send({type: 'JOIN', pseudo: myPseudo}));
        }
    }

    function checkWinCondition() {
        let activeHiders = 0;
        for(let id in players) { if(players[id].team === 'hider' && !players[id].isCaptured) activeHiders++; }
        if(activeHiders === 0 && gameActive) {
            broadcast({type: 'END', winner: 'seekers', reason: "Tous les intrus ont été brisés !"});
            showEndScreen('seekers', "Tous les intrus ont été brisés !");
        }
    }

    function broadcast(data) { connections.forEach(c => { if(c.open) c.send(data); }); }

    function selectTeam(t) {
        players[myId].team = t; refreshUI();
        if(isHost) broadcast({type: 'SYNC', players: players});
        else if(hostConn && hostConn.open) hostConn.send({type: 'SYNC', players: players});
    }

    function refreshUI() {
        const sDiv = document.getElementById('list-seekers'), hDiv = document.getElementById('list-hiders');
        if(!sDiv) return;
        sDiv.innerHTML = ''; hDiv.innerHTML = '';
        let sCount = 0, hCount = 0;
        for(let id in players) {
            let p = players[id];
            let tag = `<div class="player-tag">${p.pseudo}</div>`;
            if(p.team === 'seeker') { sCount++; sDiv.innerHTML += tag; }
            if(p.team === 'hider') { hCount++; hDiv.innerHTML += tag; }
        }
        if(isHost) {
            const btn = document.getElementById('startBtn');
            const canStart = (sCount > 0 && hCount > 0);
            btn.disabled = !canStart;
            btn.innerText = canStart ? "LANCER LA PARTIE" : "EN ATTENTE DES JOUEURS";
        }
    }

    function changeTimer(v) { if(isHost) { gameDuration = Math.max(60, gameDuration + v); updateTimerDisplay(); broadcast({type: 'SYNC_TIMER', duration: gameDuration}); } }
    function updateTimerDisplay() { let m = Math.floor(gameDuration/60), s = gameDuration%60; document.getElementById('timerSetting').innerText = `${m}:${s<10?'0'+s:s}`; }
    function showRoom(c) { document.getElementById('step-menu').classList.add('hidden'); document.getElementById('step-room').classList.remove('hidden'); document.getElementById('displayCode').innerText = c; }

    function randomizeSpawns() {
        let margin = 200;
        let sX = margin + Math.random() * (mapW - margin*2), sY = margin + Math.random() * (mapH - margin*2);
        let hX, hY;
        do { hX = margin + Math.random() * (mapW - margin*2); hY = margin + Math.random() * (mapH - margin*2); } 
        while (Math.sqrt((sX-hX)**2 + (sY-hY)**2) < mapW/2);
        for(let id in players) { 
            players[id].isCaptured = false; players[id].fear = 0;
            if(players[id].team === 'seeker') { players[id].x = sX; players[id].y = sY; } 
            else { players[id].x = hX; players[id].y = hY; } 
        }
    }

    function startClientGame() {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('ui-game').style.display = 'block';
        canvas.style.display = 'block';
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        statues.length = 0; generateMap(roomCode);
        waves.length = 0; detectionArrows.length = 0;
        gameActive = true; gameState = "PREP"; prepTimer = 10;
        lastUpdate = Date.now();
        clearInterval(logicInterval); clearInterval(masterTimer);
        logicInterval = setInterval(update, 1000/60);
        masterTimer = setInterval(() => {
            if(!gameActive) return;
            if(gameState === "PREP") {
                prepTimer--; document.getElementById('game-status').innerText = "PRÉPARATION : " + prepTimer + "s";
                if(prepTimer <= 0) gameState = "HUNT";
            } else {
                gameDuration--; let m = Math.floor(gameDuration/60), s = gameDuration%60;
                document.getElementById('game-status').innerText = "TEMPS : " + `${m}:${s<10?'0'+s:s}`;
                if(gameDuration <= 0 && isHost) { broadcast({type: 'END', winner: 'hiders', reason: "Temps écoulé !"}); showEndScreen('hiders', "Temps écoulé !"); }
            }
        }, 1000);
        requestAnimationFrame(draw);
    }

    function update() {
        const me = players[myId];
        if(!me || !gameActive) return;
        const now = Date.now(), dt = (now - lastUpdate) / 16.66;
        lastUpdate = now;

        let moved = false;
        if(!(me.team === 'seeker' && gameState === "PREP")) {
            let spd = (me.isCaptured ? 8 : (me.team === 'seeker' ? 6 : 4.5)) * dt;
            if(keys['z'] || keys['w']) { me.y -= spd; moved = true; }
            if(keys['s']) { me.y += spd; moved = true; }
            if(keys['q'] || keys['a']) { me.x -= spd; moved = true; }
            if(keys['d']) { me.x += spd; moved = true; }
        }
        me.isMoving = moved;
        me.x = Math.max(15, Math.min(mapW - 35, me.x));
        me.y = Math.max(15, Math.min(mapH - 35, me.y));

        for(let i = waves.length - 1; i >= 0; i--) {
            let w = waves[i]; w.r += 12 * dt;
            if(w.owner === myId && me.team === 'seeker' && w.waveType === 'seeker') {
                for(let id in players) {
                    let p = players[id];
                    if(p.team === 'hider' && !p.isCaptured && !w['hit_'+id]) {
                        let dist = Math.sqrt((w.x - (p.x+12))**2 + (w.y - (p.y+12))**2);
                        if(Math.abs(dist - w.r) < 25) {
                            w['hit_'+id] = true;
                            broadcast({type: 'FEAR_HIT', targetId: id, amount: 15});
                            detectionArrows.push({angle: Math.atan2((p.y+12)-(me.y+12), (p.x+12)-(me.x+12)), life: 60});
                        }
                    }
                }
            }
            if(w.r > w.maxR) waves.splice(i, 1);
        }

        for(let i = detectionArrows.length - 1; i >= 0; i--) {
            detectionArrows[i].life -= 1 * dt;
            if(detectionArrows[i].life <= 0) detectionArrows.splice(i, 1);
        }

        if(!me.isCaptured) {
            if(me.team === 'seeker') {
                me.angle = Math.atan2(mousePos.y - canvas.height/2, mousePos.x - canvas.width/2);
                if(gameState === "HUNT") {
                    for(let id in players) {
                        if(id === myId) continue;
                        let p = players[id];
                        if(p.team === 'hider' && !p.isCaptured) {
                            let dist = Math.sqrt((me.x - p.x)**2 + (me.y - p.y)**2);
                            if(dist < 40) {
                                let captMsg = {type: 'CAPTURE', targetId: id};
                                if(isHost) { players[id].isCaptured = true; broadcast({type: 'SYNC', players: players}); checkWinCondition(); }
                                else if(hostConn && hostConn.open) { hostConn.send(captMsg); }
                            }
                        }
                    }
                }
            } else if(gameState === "HUNT") {
                // Si on bouge, la peur descend. Sinon, elle monte.
                if(!moved) me.fear = Math.min(100, me.fear + 0.4 * dt); 
                else me.fear = Math.max(0, me.fear - 1.2 * dt);
                
                // SI JAUGE AU MAX : SPAM D'ONDES ROUGES
                if(me.fear >= 100) {
                    fearSpamCounter += 1 * dt;
                    if(fearSpamCounter >= 20) { // Environ toutes les 20 frames
                        fearSpamCounter = 0;
                        let waveData = {type: 'SHOCKWAVE', x: me.x + 12, y: me.y + 12, owner: myId, maxR: 150, waveType: 'fear'};
                        waves.push({x: waveData.x, y: waveData.y, r: 0, maxR: 150, owner: myId, waveType: 'fear'});
                        if(isHost) broadcast(waveData); else if(hostConn && hostConn.open) hostConn.send(waveData);
                    }
                } else {
                    fearSpamCounter = 0;
                }
            }
        }
        
        let syncData = {type: 'POS', id: myId, x: me.x, y: me.y, angle: me.angle, fear: me.fear, isMoving: me.isMoving, isCaptured: me.isCaptured};
        if(isHost) broadcast(syncData); else if(hostConn && hostConn.open) hostConn.send(syncData);
    }

    function draw() {
        if(!gameActive) return;
        const me = players[myId];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const camX = -me.x + canvas.width/2, camY = -me.y + canvas.height/2;
        
        ctx.save(); ctx.translate(camX, camY);
        ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 10; ctx.strokeRect(0,0, mapW, mapH);
        ctx.fillStyle = "#111"; ctx.fillRect(0,0, mapW, mapH);
        statues.forEach(s => drawStatue(s.x, s.y, "#555", false, false, false, false, 0));
        
        waves.forEach(w => {
            ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
            if(w.waveType === 'fear') {
                ctx.strokeStyle = `rgba(231, 76, 60, ${1 - w.r/w.maxR})`; 
                ctx.lineWidth = 10; // ONDE DE PEUR PLUS ÉPAISSE
            } else {
                ctx.strokeStyle = `rgba(52, 152, 219, ${1 - w.r/w.maxR})`; 
                ctx.lineWidth = 4; // ONDE CHERCHEUR NORMALE
            }
            ctx.stroke();
        });

        for(let id in players) {
            let p = players[id];
            let isMe = (id === myId);
            if(p.isCaptured) {
                if(isMe) drawStatue(p.x, p.y, "rgba(255,255,255,0.6)", false, true, false, true, 0);
                continue;
            }
            if(p.team === 'hider') {
                let baseColor = p.isMoving ? "#333" : "#555"; 
                let color = (isMe || me.team !== 'seeker') && p.fear > 80 ? "#962d22" : baseColor;
                drawStatue(p.x, p.y, color, p.fear >= 100, isMe, p.isMoving, false, p.fear);
            } else { drawSeeker(p); }
        }
        ctx.restore();
        drawLighting(me);
        if(me.team === 'seeker' && !me.isCaptured) {
            detectionArrows.forEach(arr => {
                ctx.save(); ctx.translate(canvas.width/2 + 12, canvas.height/2 + 12); ctx.rotate(arr.angle);
                ctx.fillStyle = `rgba(241, 196, 15, ${arr.life / 60})`; ctx.beginPath();
                ctx.moveTo(84, 0); ctx.lineTo(63, -14); ctx.lineTo(63, 14); ctx.closePath(); ctx.fill(); ctx.restore();
            });
        }
        if(me.team === 'hider' && !me.isCaptured) { 
            document.getElementById('fear-ui').classList.remove('hidden'); 
            document.getElementById('fear-fill').style.width = me.fear + "%"; 
        } else { document.getElementById('fear-ui').classList.add('hidden'); }
        requestAnimationFrame(draw);
    }

    function drawStatue(x, y, color, pulse, isSelf, moving, isGhost, fearValue) {
        ctx.save();
        if(!isGhost && fearValue > 50) {
            let intensity = (fearValue - 50) / 10; // Tremblement un peu plus fort
            x += (Math.random() - 0.5) * intensity; y += (Math.random() - 0.5) * intensity;
        }
        if(isGhost) {
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.beginPath(); ctx.ellipse(x-5, y+10, 10, 5, -0.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(x+30, y+10, 10, 5, 0.5, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(x+12, y+28, 15, 6, 0, 0, Math.PI*2); ctx.fill();
        }
        ctx.fillStyle = color; ctx.fillRect(x, y, 25, 25);
        if(isSelf && !isGhost) { ctx.fillStyle = "#f1c40f"; ctx.fillRect(x+10, y-5, 5, 5); }
        ctx.restore();
    }

    function drawSeeker(p) { ctx.fillStyle = "#3498db"; ctx.fillRect(p.x, p.y, 25, 25); ctx.strokeStyle = "white"; ctx.strokeRect(p.x, p.y, 25, 25); }

    function drawLighting(me) {
        ctx.save();
        const camX = -me.x + canvas.width/2, camY = -me.y + canvas.height/2;
        if(me.isCaptured) {
            ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fillRect(0,0, canvas.width, canvas.height);
        } else if(me.team === 'seeker') {
            ctx.fillStyle = "black"; ctx.beginPath(); ctx.rect(0,0, canvas.width, canvas.height);
            if(gameState === "HUNT") { ctx.moveTo(canvas.width/2+12, canvas.height/2+12); ctx.arc(canvas.width/2+12, canvas.height/2+12, 550, me.angle-0.55, me.angle+0.55); ctx.fill("evenodd"); }
            else { ctx.fill(); }
        } else {
            let g = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, canvas.width);
            g.addColorStop(0, "transparent"); g.addColorStop(1, "rgba(0,0,0,0.85)");
            ctx.fillStyle = g; ctx.fillRect(0,0, canvas.width, canvas.height);
            if(gameState === "HUNT") {
                for(let id in players) {
                    let p = players[id];
                    if(p.team === 'seeker') {
                        ctx.save(); ctx.translate(camX + p.x + 12, camY + p.y + 12); ctx.rotate(p.angle);
                        let b = ctx.createRadialGradient(0,0,50,0,0,550); b.addColorStop(0, "rgba(255,255,200,0.2)"); b.addColorStop(1, "transparent");
                        ctx.fillStyle = b; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,550,-0.55,0.55); ctx.fill(); ctx.restore();
                    }
                }
            }
        }
        ctx.restore();
    }

    function generateMap(s) {
        let seed = 0; for(let i=0; i<s.length; i++) seed += s.charCodeAt(i);
        const pseudoRand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
        statues.length = 0;
        let count = mapSizeKey === 'S' ? 180 : mapSizeKey === 'M' ? 360 : 540;
        while(statues.length < count) {
            let x = 100 + pseudoRand() * (mapW - 200), y = 100 + pseudoRand() * (mapH - 200);
            if(!statues.some(st => Math.sqrt((x-st.x)**2 + (y-st.y)**2) < 65)) statues.push({x, y});
        }
    }

    function showEndScreen(w, r) {
        gameActive = false; clearInterval(logicInterval); clearInterval(masterTimer);
        document.getElementById('ui-game').style.display = 'none';
        document.getElementById('end-screen').style.display = 'block';
        document.getElementById('victory-title').innerText = (w === 'seekers') ? "L'INTRUS A GAGNÉ" : "LES STATUES ONT SURVÉCU";
        document.getElementById('victory-desc').innerText = r;
    }

    function requestBackToLobby() { if(isHost) { broadcast({type: 'BACK_LOBBY'}); resetToLobby(); } }
    
    function resetToLobby() { 
        gameActive = false; clearInterval(logicInterval); clearInterval(masterTimer);
        canvas.style.display = 'none'; document.getElementById('end-screen').style.display = 'none'; 
        document.getElementById('lobby').style.display = 'block'; 
        for(let id in players) { players[id].isCaptured = false; players[id].fear = 0; }
        let timeParts = document.getElementById('timerSetting').innerText.split(':');
        gameDuration = parseInt(timeParts[0]) * 60 + parseInt(timeParts[1]);
        updateTimerDisplay(); refreshUI(); 
    }

    function requestStart() { if(isHost) { randomizeSpawns(); broadcast({type: 'START', players: players}); setTimeout(startClientGame, 200); } }

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => { mousePos.x = e.clientX; mousePos.y = e.clientY; });
    window.addEventListener('mousedown', e => {
        const me = players[myId];
        if(gameActive && !me.isCaptured && gameState === "HUNT" && me.team === 'seeker' && e.button === 0) {
            if(Date.now() - lastShockwave > 4000) {
                lastShockwave = Date.now();
                let waveData = {type: 'SHOCKWAVE', x: me.x + 12, y: me.y + 12, owner: myId, maxR: mapW, waveType: 'seeker'};
                waves.push({x: waveData.x, y: waveData.y, r: 0, maxR: mapW, owner: myId, waveType: 'seeker'});
                if(isHost) broadcast(waveData); else if(hostConn && hostConn.open) hostConn.send(waveData);
            }
        }
    });
</script>
