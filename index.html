<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Statu Hunt - Copy Fix</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #lobby, #end-screen { background: #2c3e50; padding: 30px; border-radius: 15px; text-align: center; width: 550px; box-shadow: 0 0 50px rgba(0,0,0,0.8); z-index: 100; border: 1px solid #34495e; position: absolute; }
        #end-screen { display: none; background: rgba(20, 30, 48, 0.98); z-index: 200; border: 2px solid #f1c40f; }
        input { padding: 12px; border-radius: 8px; border: none; width: 80%; text-align: center; font-size: 1rem; background: #1a1a1a; color: white; margin-bottom: 10px; border: 1px solid #34495e; }
        button { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; margin: 5px; position: relative; z-index: 150; text-transform: uppercase; letter-spacing: 1px; }
        .btn-blue { background: #3498db; color: white; box-shadow: 0 4px #2980b9; }
        .btn-red { background: #e74c3c; color: white; box-shadow: 0 4px #c0392b; }
        .btn-green { background: #27ae60; color: white; width: 100%; margin-top: 15px; font-size: 1.1rem; box-shadow: 0 4px #1e8449; }
        .config-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin: 15px 0; }
        .teams { display: flex; gap: 15px; margin-top: 20px; }
        .team-box { flex: 1; background: #1a252f; padding: 10px; border-radius: 10px; min-height: 150px; border: 1px solid #34495e; }
        .player-tag { background: rgba(52, 152, 219, 0.1); padding: 8px; margin: 5px 0; border-radius: 6px; font-size: 0.9rem; border-left: 4px solid #f1c40f; text-align: left; }
        canvas { position: absolute; top: 0; left: 0; display: none; background: #000; }
        #ui-game { position: absolute; top: 20px; left: 20px; z-index: 50; display: none; pointer-events: none; width: calc(100% - 40px); }
        #game-status { color: #f1c40f; font-weight: bold; font-size: 1.8rem; text-shadow: 3px 3px 5px #000; }
        .fear-bar-container { width: 300px; background: rgba(0,0,0,0.7); padding: 12px; border-radius: 10px; margin-top: 10px; }
        .fear-bar { width: 100%; height: 15px; background: #222; border-radius: 10px; overflow: hidden; margin-top: 8px; }
        #fear-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #e74c3c, #ff4d4d); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1 style="color: #f1c40f; letter-spacing: 3px;">STATU HUNT</h1>
        <div id="step-pseudo">
            <input type="text" id="pseudoInput" placeholder="NOM DU JOUEUR..." maxlength="15">
            <br><button class="btn-blue" onclick="confirmPseudo()">REJOINDRE</button>
        </div>
        <div id="step-menu" class="hidden">
            <button class="btn-blue" onclick="createRoom()">CRÉER SALLE</button>
            <p>— OU —</p>
            <input type="text" id="joinInput" placeholder="CODE">
            <br><button class="btn-blue" onclick="joinRoom()">REJOINDRE SALLE</button>
        </div>
        <div id="step-room" class="hidden">
            <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px;">
                CODE : <span id="displayCode" style="color:#f1c40f; font-weight: bold; font-size: 1.2rem;">---</span>
                <button id="copyBtn" class="btn-blue" style="font-size: 0.7rem; padding: 5px 10px; margin-left: 10px;" onclick="copyCode()">COPIER</button>
            </div>
            <div class="config-box">
                DURÉE : <button class="btn-blue" onclick="changeTimer(-30)">-</button>
                <span id="timerSetting" style="margin: 0 10px; font-weight: bold;">2:00</span>
                <button class="btn-blue" onclick="changeTimer(30)">+</button>
            </div>
            <div class="teams">
                <div class="team-box"><h4>CHERCHEURS</h4><button onclick="selectTeam('seeker')" class="btn-blue" style="font-size: 0.7rem;">REJOINDRE</button><div id="list-seekers"></div></div>
                <div class="team-box"><h4>CACHÉS</h4><button onclick="selectTeam('hider')" class="btn-red" style="font-size: 0.7rem;">REJOINDRE</button><div id="list-hiders"></div></div>
            </div>
            <button id="startBtn" class="hidden btn-green" onclick="requestStart()" disabled>LANCER LA PARTIE</button>
        </div>
    </div>

    <div id="end-screen">
        <h2 id="victory-title">FIN</h2>
        <p id="victory-desc" style="font-style: italic; color: #bdc3c7;"></p>
        <button id="backToLobbyBtn" class="btn-green" onclick="requestBackToLobby()" style="display:none;">RETOUR LOBBY</button>
    </div>

    <div id="ui-game">
        <div id="game-status"></div>
        <div id="fear-ui" class="fear-bar-container hidden">
            <div class="fear-bar"><div id="fear-fill"></div></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    let myPseudo, myId, isHost = false, players = {}, peer, conn, gameActive = false, roomCode = "";
    let gameState = "PREP", prepTimer = 10, gameDuration = 120, initialDuration = 120;
    let lastUpdate = Date.now(), logicInterval, masterTimer;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mapW = 2000, mapH = 2000, keys = {}, statues = [];
    let mousePos = { x: 0, y: 0 };

    function confirmPseudo() {
        myPseudo = document.getElementById('pseudoInput').value.trim();
        if(myPseudo) { document.getElementById('step-pseudo').classList.add('hidden'); document.getElementById('step-menu').classList.remove('hidden'); }
    }

    function copyCode() {
        navigator.clipboard.writeText(roomCode).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "COPIÉ !";
            setTimeout(() => btn.innerText = "COPIER", 2000);
        });
    }

    function createRoom() {
        roomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
        isHost = true; setupPeer('SH-' + roomCode); showRoom(roomCode);
        document.getElementById('startBtn').classList.remove('hidden');
        document.getElementById('backToLobbyBtn').style.display = 'block';
    }

    function joinRoom() {
        roomCode = document.getElementById('joinInput').value.toUpperCase().trim();
        setupPeer();
        setTimeout(() => { conn = peer.connect('SH-' + roomCode); initConn(conn); }, 800);
        showRoom(roomCode);
    }

    function setupPeer(id = null) {
        peer = new Peer(id);
        peer.on('open', (i) => {
            myId = i;
            players[myId] = {pseudo: myPseudo, team: null, x: 1000, y: 1000, angle: 0, fear: 0};
            refreshUI();
        });
        peer.on('connection', (c) => {
            conn = c; initConn(c);
            if(isHost) setTimeout(() => { c.send({type:'SYNC', players: players}); c.send({type:'SYNC_TIMER', duration: gameDuration}); }, 1000);
        });
    }

    function initConn(c) {
        c.on('data', (data) => {
            if(data.type === 'JOIN') { players[c.peer] = {pseudo: data.pseudo, team: null, x: 1000, y: 1000, angle: 0, fear: 0}; if(isHost) broadcast({type:'SYNC', players: players}); }
            if(data.type === 'SYNC') { players = data.players; refreshUI(); }
            if(data.type === 'SYNC_TIMER') { gameDuration = data.duration; updateTimerDisplay(); }
            if(data.type === 'START') { players = data.players; startClientGame(); }
            if(data.type === 'END') showEndScreen(data.winner, data.reason);
            if(data.type === 'BACK_LOBBY') resetToLobby();
            if(data.type === 'KILL' && isHost) {
                broadcast({type: 'END', winner: 'seekers', reason: data.reason});
                showEndScreen('seekers', data.reason);
            }
            if(data.type === 'POS') { if(players[data.id]) players[data.id] = {...players[data.id], ...data}; }
        });
        if(!isHost) c.on('open', () => c.send({type: 'JOIN', pseudo: myPseudo}));
    }

    function broadcast(data) { if(conn && conn.open) conn.send(data); }

    function selectTeam(t) {
        players[myId].team = t;
        refreshUI();
        if(isHost) broadcast({type: 'SYNC', players: players});
        else if(conn) conn.send({type: 'SYNC', players: players});
    }

    function refreshUI() {
        const sDiv = document.getElementById('list-seekers'), hDiv = document.getElementById('list-hiders');
        if(!sDiv) return;
        sDiv.innerHTML = ''; hDiv.innerHTML = '';
        let sCount = 0, hCount = 0;
        for(let id in players) {
            let p = players[id];
            let tag = `<div class="player-tag">${p.pseudo}</div>`;
            if(p.team === 'seeker') { sCount++; sDiv.innerHTML += tag; }
            if(p.team === 'hider') { hCount++; hDiv.innerHTML += tag; }
        }
        if(isHost) document.getElementById('startBtn').disabled = !(sCount > 0 && hCount > 0);
    }

    function changeTimer(v) { if(isHost) { gameDuration = Math.max(60, gameDuration + v); updateTimerDisplay(); broadcast({type: 'SYNC_TIMER', duration: gameDuration}); } }
    function updateTimerDisplay() { let m = Math.floor(gameDuration/60), s = gameDuration%60; document.getElementById('timerSetting').innerText = `${m}:${s<10?'0'+s:s}`; }
    function showRoom(c) { document.getElementById('step-menu').classList.add('hidden'); document.getElementById('step-room').classList.remove('hidden'); document.getElementById('displayCode').innerText = c; }

    function randomizeSpawns() {
        let sX = 200 + Math.random() * 1600, sY = 200 + Math.random() * 1600;
        let hX, hY;
        do { hX = 200 + Math.random() * 1600; hY = 200 + Math.random() * 1600; } while (Math.sqrt((sX-hX)**2 + (sY-hY)**2) < 800);
        for(let id in players) { if(players[id].team === 'seeker') { players[id].x = sX; players[id].y = sY; } else { players[id].x = hX; players[id].y = hY; } }
    }

    function startClientGame() {
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('ui-game').style.display = 'block';
        canvas.style.display = 'block';
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        statues.length = 0; generateMap(roomCode);
        gameActive = true; gameState = "PREP"; prepTimer = 10;
        lastUpdate = Date.now();
        logicInterval = setInterval(update, 1000/60);
        masterTimer = setInterval(() => {
            if(!gameActive) return;
            if(gameState === "PREP") {
                prepTimer--;
                document.getElementById('game-status').innerText = "PRÉPARATION : " + prepTimer + "s";
                if(prepTimer <= 0) gameState = "HUNT";
            } else {
                gameDuration--;
                let m = Math.floor(gameDuration/60), s = gameDuration%60;
                document.getElementById('game-status').innerText = "TEMPS : " + `${m}:${s<10?'0'+s:s}`;
                if(gameDuration <= 0 && isHost) { broadcast({type: 'END', winner: 'hiders', reason: "Temps écoulé !"}); showEndScreen('hiders', "Temps écoulé !"); }
            }
        }, 1000);
        requestAnimationFrame(draw);
    }

    function update() {
        const me = players[myId];
        if(!me || !gameActive) return;
        const now = Date.now(), dt = (now - lastUpdate) / 16.66;
        lastUpdate = now;

        let moved = false;
        if(!(me.team === 'seeker' && gameState === "PREP")) {
            let spd = (me.team === 'seeker' ? 6 : 4.5) * dt;
            if(keys['z'] || keys['w']) { me.y -= spd; moved = true; }
            if(keys['s']) { me.y += spd; moved = true; }
            if(keys['q'] || keys['a']) { me.x -= spd; moved = true; }
            if(keys['d']) { me.x += spd; moved = true; }
        }

        if(me.team === 'seeker') {
            me.angle = Math.atan2(mousePos.y - canvas.height/2, mousePos.x - canvas.width/2);
            if(gameState === "HUNT") {
                for(let id in players) {
                    let p = players[id];
                    if(p.team === 'hider') {
                        let dist = Math.sqrt((me.x - p.x)**2 + (me.y - p.y)**2);
                        if(dist < 50) { // Collision validée !
                            let killMsg = {type: 'KILL', reason: `${p.pseudo} a été brisé !`};
                            if(isHost) { broadcast({type: 'END', winner: 'seekers', reason: killMsg.reason}); showEndScreen('seekers', killMsg.reason); }
                            else { conn.send(killMsg); }
                            gameActive = false;
                        }
                    }
                }
            }
        } else if(gameState === "HUNT") {
            if(!moved) me.fear = Math.min(100, me.fear + 0.4 * dt); else me.fear = Math.max(0, me.fear - 1.2 * dt);
        }
        if(conn && conn.open) conn.send({type: 'POS', id: myId, x: me.x, y: me.y, angle: me.angle, fear: me.fear});
    }

    function draw() {
        if(!gameActive) return;
        const me = players[myId];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const camX = -me.x + canvas.width/2, camY = -me.y + canvas.height/2;
        ctx.save(); ctx.translate(camX, camY);
        ctx.fillStyle = "#111"; ctx.fillRect(0,0, mapW, mapH);
        statues.forEach(s => drawStatue(s.x, s.y, "#555", false, false));
        for(let id in players) {
            let p = players[id];
            if(p.team === 'hider') {
                let isMe = (id === myId);
                let color = (isMe || me.team !== 'seeker') && p.fear > 80 ? "#962d22" : "#555";
                let ox = (p.fear > 80) ? (Math.sin(Date.now() / 40) * 1.5) : 0;
                drawStatue(p.x + ox, p.y, color, p.fear >= 100, isMe);
            } else { drawSeeker(p); }
        }
        ctx.restore();
        drawLighting(me);
        if(me.team === 'hider') { 
            document.getElementById('fear-ui').classList.remove('hidden'); 
            document.getElementById('fear-fill').style.width = me.fear + "%"; 
        }
        requestAnimationFrame(draw);
    }

    function drawStatue(x, y, color, pulse, isSelf) {
        ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(x+12, y+28, 15, 6, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = color; ctx.fillRect(x, y, 25, 25);
        if(isSelf) { ctx.fillStyle = "#f1c40f"; ctx.fillRect(x+10, y-5, 5, 5); }
        if(pulse) { ctx.beginPath(); ctx.arc(x+12, y+12, (Date.now()%1000)/15+10, 0, Math.PI*2); ctx.strokeStyle="red"; ctx.stroke(); }
    }

    function drawSeeker(p) { ctx.fillStyle = "#3498db"; ctx.fillRect(p.x, p.y, 25, 25); ctx.strokeStyle = "white"; ctx.strokeRect(p.x, p.y, 25, 25); }

    function drawLighting(me) {
        ctx.save();
        const camX = -me.x + canvas.width/2, camY = -me.y + canvas.height/2;
        if(me.team === 'seeker') {
            ctx.fillStyle = "black"; ctx.beginPath(); ctx.rect(0,0, canvas.width, canvas.height);
            if(gameState === "HUNT") { ctx.moveTo(canvas.width/2+12, canvas.height/2+12); ctx.arc(canvas.width/2+12, canvas.height/2+12, 500, me.angle-0.55, me.angle+0.55); ctx.fill("evenodd"); }
            else { ctx.fill(); ctx.fillStyle="white"; ctx.textAlign="center"; ctx.fillText("PHASE DE PRÉPARATION", canvas.width/2, canvas.height/2); }
        } else {
            let g = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, canvas.width);
            g.addColorStop(0, "transparent"); g.addColorStop(1, "rgba(0,0,0,0.8)");
            ctx.fillStyle = g; ctx.fillRect(0,0, canvas.width, canvas.height);
            if(gameState === "HUNT") {
                for(let id in players) {
                    let p = players[id];
                    if(p.team === 'seeker') {
                        ctx.save(); ctx.translate(camX + p.x + 12, camY + p.y + 12); ctx.rotate(p.angle);
                        let b = ctx.createRadialGradient(0,0,50,0,0,500); b.addColorStop(0, "rgba(255,255,200,0.2)"); b.addColorStop(1, "transparent");
                        ctx.fillStyle = b; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,500,-0.55,0.55); ctx.fill(); ctx.restore();
                    }
                }
            }
        }
        ctx.restore();
    }

    function generateMap(s) {
        let seed = 0; for(let i=0; i<s.length; i++) seed += s.charCodeAt(i);
        for(let i=0; i<150; i++) { seed = (seed * 9301 + 49297) % 233280; statues.push({x: 100 + (seed/233280)*1800, y: 100 + ((seed*2)/233280)%1*1800}); }
    }

    function showEndScreen(w, r) {
        gameActive = false; clearInterval(logicInterval); clearInterval(masterTimer);
        document.getElementById('ui-game').style.display = 'none';
        document.getElementById('end-screen').style.display = 'block';
        document.getElementById('victory-title').innerText = (w === 'seekers') ? "L'INTRUS A GAGNÉ" : "LES STATUES ONT SURVÉCU";
        document.getElementById('victory-desc').innerText = r;
    }

    function requestBackToLobby() { if(isHost) { broadcast({type: 'BACK_LOBBY'}); resetToLobby(); } }
    function resetToLobby() { gameActive = false; canvas.style.display = 'none'; document.getElementById('end-screen').style.display = 'none'; document.getElementById('lobby').style.display = 'block'; refreshUI(); }
    function requestStart() { if(isHost) { randomizeSpawns(); broadcast({type: 'START', players: players}); startClientGame(); } }

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => { mousePos.x = e.clientX; mousePos.y = e.clientY; });
</script>
</body>
</html>
