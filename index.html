<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Statu Hunt - Multiplayer Lobby</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        #lobby { background: #2c3e50; padding: 30px; border-radius: 15px; text-align: center; width: 650px; box-shadow: 0 0 30px rgba(0,0,0,0.7); border: 1px solid #34495e; }
        
        h1 { color: #f1c40f; margin-bottom: 30px; letter-spacing: 2px; }

        .input-group { margin: 20px 0; }
        input { padding: 12px; border-radius: 8px; border: 2px solid #34495e; background: #1a1a1a; color: white; text-align: center; font-size: 1.1rem; width: 80%; outline: none; }
        input:focus { border-color: #3498db; }
        
        .teams-container { display: flex; justify-content: space-between; margin-top: 25px; gap: 20px; }
        .team-box { flex: 1; background: #34495e; padding: 15px; border-radius: 12px; min-height: 200px; display: flex; flex-direction: column; }
        .team-chercheur { border-bottom: 6px solid #3498db; }
        .team-cache { border-bottom: 6px solid #e74c3c; }
        
        .player-list { margin-top: 15px; flex-grow: 1; }
        .player-name { background: rgba(0,0,0,0.3); margin: 6px 0; padding: 8px; border-radius: 6px; font-size: 0.95rem; border-left: 3px solid #f1c40f; text-align: left; }
        
        button { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 1rem; transition: all 0.2s ease; margin: 5px; }
        button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.2); }
        button:active:not(:disabled) { transform: translateY(0); }
        
        .btn-blue { background: #3498db; color: white; }
        .btn-red { background: #e74c3c; color: white; }
        .btn-green { background: #27ae60; color: white; width: 100%; margin-top: 20px; }
        
        button:disabled { background: #7f8c8d; cursor: not-allowed; opacity: 0.6; }
        
        .hidden { display: none; }
        #info-status { margin-top: 15px; font-size: 0.85rem; color: #95a5a6; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1>STATU HUNT</h1>

        <div id="step-pseudo">
            <h3>BIENVENUE</h3>
            <div class="input-group">
                <input type="text" id="pseudoInput" placeholder="Ton pseudo (ex: Chasseur99)" maxlength="12">
            </div>
            <button onclick="confirmPseudo()" class="btn-blue">CONTINUER</button>
        </div>

        <div id="step-menu" class="hidden">
            <button onclick="createRoom()" class="btn-blue">CRÉER UNE SALLE</button>
            <p style="margin:15px; color:#95a5a6;">— OU —</p>
            <div class="input-group">
                <input type="text" id="joinInput" placeholder="CODE DE PARTIE">
            </div>
            <button onclick="joinRoom()" class="btn-blue">REJOINDRE</button>
        </div>

        <div id="step-room" class="hidden">
            <p>CODE DE LA SALLE : <span id="displayCode" style="color:#f1c40f; font-size: 1.6rem; font-weight: bold;">---</span></p>
            
            <div class="teams-container">
                <div class="team-box team-chercheur">
                    <h3 id="labelSeekers">CHERCHEURS (0)</h3>
                    <button onclick="selectTeam('seeker')" class="btn-blue">REJOINDRE</button>
                    <div id="list-seekers" class="player-list"></div>
                </div>
                
                <div class="team-box team-cache">
                    <h3 id="labelHiders">CACHÉS (0)</h3>
                    <button onclick="selectTeam('hider')" class="btn-red">REJOINDRE</button>
                    <div id="list-hiders" class="player-list"></div>
                </div>
            </div>

            <p id="info-status">Initialisation du réseau...</p>
