<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Statu Hunt - Multiplayer Lobby</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #lobby { background: #2c3e50; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.5); z-index: 100; }
        input { padding: 10px; border-radius: 5px; border: none; margin: 10px; width: 150px; text-align: center; font-size: 1.2rem; }
        button { padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; background: #3498db; color: white; font-weight: bold; transition: 0.3s; }
        button:hover { background: #2980b9; transform: scale(1.05); }
        .hidden { display: none; }
        #status-ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        canvas { display: none; background: #000; }
    </style>
</head>
<body>

    <div id="lobby">
        <h1>STATU HUNT</h1>
        <div id="menu-initial">
            <button onclick="createRoom()">CRÉER UNE PARTIE</button>
            <p>OU</p>
            <input type="text" id="joinInput" placeholder="CODE DE PARTIE">
            <button onclick="joinRoom()">REJOINDRE</button>
        </div>

        <div id="room-info" class="hidden">
            <p>CODE DE LA PARTIE : <b id="displayCode" style="color:#f1c40f; font-size: 1.5rem;">---</b></p>
            <div style="margin: 20px;">
                <button onclick="selectTeam('seeker')" id="btnSeeker" style="background:#3498db">REJOINDRE CHERCHEURS (0)</button>
                <button onclick="selectTeam('hider')" id="btnHider" style="background:#e74c3c">REJOINDRE CACHÉS (0)</button>
            </div>
            <p id="playerCount">En attente de joueurs...</p>
            <button id="startBtn" class="hidden" style="background:#27ae60" onclick="launchGame()">LANCER LA PARTIE</button>
        </div>
    </div>

    <div id="status-ui" class="hidden">
        <div id="gameTimer">PRÉPARATION...</div>
        <div style="width:200px; height:10px; background:#333; margin-top:5px;"><div id="fear-fill" style="width:0%; height:100%; background:#e74c3c;"></div></div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
    // --- CONFIGURATION RÉSEAU ---
    let peer;
    let conn;
    let myId;
    let isHost = false;
    let players = {}; // Liste des joueurs connectés
    let myTeam = null;

    // Fonction pour créer une partie
    function createRoom() {
        const roomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
        initPeer(roomCode);
        isHost = true;
        showRoom(roomCode);
        document.getElementById('startBtn').classList.remove('hidden');
    }

    // Fonction pour rejoindre
    function joinRoom() {
        const code = document.getElementById('joinInput').value.toUpperCase();
        if(code.length < 5) return alert("Code invalide");
        initPeer();
        setTimeout(() => {
            conn = peer.connect('SH-' + code);
            setupConn();
        }, 1000);
        showRoom(code);
    }

    function initPeer(id = null) {
        // SH- pour éviter les conflits de noms sur le serveur PeerJS
        peer = new Peer(id ? 'SH-' + id : undefined);
        
        peer.on('open', (newId) => {
            myId = newId;
            console.log("Mon ID réseau : " + myId);
        });

        peer.on('connection', (c) => {
            conn = c;
            setupConn();
            // L'hôte envoie la liste des joueurs ici (à dev dans l'étape suivante)
        });
    }

    function setupConn() {
        conn.on('open', () => {
            console.log("Connecté !");
            document.getElementById('playerCount').innerText = "Connecté au salon !";
        });
        conn.on('data', (data) => {
            // Ici on recevra les positions des autres joueurs
            console.log("Données reçues:", data);
        });
    }

    function showRoom(code) {
        document.getElementById('menu-initial').classList.add('hidden');
        document.getElementById('room-info').classList.remove('hidden');
        document.getElementById('displayCode').innerText = code;
    }

    function selectTeam(team) {
        myTeam = team;
        alert("Tu as rejoint l'équipe : " + (team === 'seeker' ? 'Chercheur' : 'Caché'));
        // Envoyer l'info au réseau
        if(conn && conn.open) conn.send({type: 'TEAM_SELECT', team: team, id: myId});
    }

    function launchGame() {
        // Envoi du signal de départ à tout le monde
        if(isHost) {
            // On cachera le lobby et on affichera le canvas
            // Pour l'instant on simule le lancement
            alert("Lancement du jeu (La synchronisation des positions arrive à l'étape suivante !)");
        }
    }

    // --- ICI LE CODE DE TON JEU (INDEX.HTML PRÉCÉDENT) ---
    // On l'activera une fois la connexion validée !
</script>
</body>
</html>
